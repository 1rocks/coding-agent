name: Check Repaired Worker

on:
workflow_dispatch:
push:
paths:
- “.github/workflows/check-worker.yml”

jobs:
syntax-check:
runs-on: ubuntu-latest
steps:
- name: Check out safe-coding branch
uses: actions/checkout@v4
with:
ref: feature/safe-coding-workf

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
  - name: Check JavaScript syntax
    run: node --check worker-prepaired.js

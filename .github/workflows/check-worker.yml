name: Check Repaired Worker

on:
  push:
    branches:
      - feature/safe-coding-workf
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feature/safe-coding-workf

      - name: Show checked-out revision
        run: |
          git status --short --branch
          git log -1 --format='%H %s'
          test -f worker-prepaired.js && echo "Draft file found"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check repaired worker syntax
        run: node --input-type=module --check < worker-prepaired.js
